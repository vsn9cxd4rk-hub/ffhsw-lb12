# =============================================================================
# Nginx-Konfiguration für das Feuerwehr Management System (Docker)
# Angepasste Kopie von deploy/nginx/fuerwehr.conf: proxy_pass zeigt auf den
# Compose-Service "backend" statt 127.0.0.1, /uploads/ zeigt auf das
# gemeinsame Named Volume "uploads_data".
# =============================================================================

server {
    listen 80;
    server_name _;

    # Security-Header
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Frontend (React SPA)
    root /usr/share/nginx/html;
    index index.html;

    # Gzip-Kompression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        text/xml
        application/xml
        image/svg+xml;
    gzip_min_length 1000;

    # Statische Assets (langes Caching für Vite-Hashed-Dateien)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # API-Proxy zum Backend-Container
    location /api/ {
        proxy_pass http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 90s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        client_max_body_size 10M;

        # Keine Security-Header für API-Antworten überschreiben
        proxy_hide_header X-Powered-By;
    }

    # Upload-Dateien (gemeinsames Named Volume mit dem Backend-Container)
    location /uploads/ {
        alias /usr/share/nginx/uploads/;
        expires 30d;
        add_header Cache-Control "public";
        # Verhindere Ausführung von Skripten in Uploads
        location ~* \.(php|pl|py|sh|cgi)$ {
            deny all;
        }
    }

    # SPA-Fallback für React Router
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Versteckte Dateien und .env verweigern
    location ~ /\. { deny all; }
    location ~ \.env { deny all; }
}
