services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-feuerwehrmanagementsystem}
      MYSQL_USER: ${DB_USER:-feuerwehr}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD muss in .env gesetzt sein}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD muss in .env gesetzt sein}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - feuerwehr
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build:
      context: ../../
      dockerfile: deploy/docker/backend.Dockerfile
    image: feuerwehr-management-backend:${APP_VERSION:-1.1.0}
    restart: unless-stopped
    environment:
      DATABASE_URL: mysql://${DB_USER:-feuerwehr}:${DB_PASSWORD:?DB_PASSWORD muss in .env gesetzt sein}@db:3306/${DB_NAME:-feuerwehrmanagementsystem}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET muss in .env gesetzt sein}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET muss in .env gesetzt sein}
      JWT_ACCESS_EXPIRES: ${JWT_ACCESS_EXPIRES:-15m}
      JWT_REFRESH_EXPIRES: ${JWT_REFRESH_EXPIRES:-7d}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-noreply@feuerwehr.local}
    volumes:
      - uploads_data:/app/uploads
      - backend_logs:/app/logs
    networks:
      - feuerwehr
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ../../
      dockerfile: deploy/docker/frontend.Dockerfile
    image: feuerwehr-management-frontend:${APP_VERSION:-1.1.0}
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - uploads_data:/usr/share/nginx/uploads:ro
    networks:
      - feuerwehr
    depends_on:
      backend:
        condition: service_healthy

  # Einmaliger Bootstrap der Initialdaten (Admin-User, Stammdaten).
  # Startet NIE bei "docker compose up" - nur explizit via:
  #   docker compose --profile tools run --rm backend-seed
  backend-seed:
    build:
      context: ../../
      dockerfile: deploy/docker/backend.Dockerfile
      target: builder
    profiles: ["tools"]
    environment:
      DATABASE_URL: mysql://${DB_USER:-feuerwehr}:${DB_PASSWORD:?DB_PASSWORD muss in .env gesetzt sein}@db:3306/${DB_NAME:-feuerwehrmanagementsystem}
    command: ["npm", "run", "prisma:seed"]
    networks:
      - feuerwehr
    depends_on:
      db:
        condition: service_healthy

networks:
  feuerwehr:
    driver: bridge

volumes:
  db_data: {}
  uploads_data: {}
  backend_logs: {}
