# =============================================================================
# Nginx-Konfiguration für das Feuerwehr Management System
# Einbinden:
#   sudo mkdir -p /etc/nginx/snippets
#   sudo cp deploy/nginx/security-headers.conf /etc/nginx/snippets/feuerwehr-security-headers.conf
#   sudo cp deploy/nginx/feuerwehr.conf /etc/nginx/conf.d/feuerwehr.conf
#   sudo nginx -t && sudo systemctl reload nginx
# =============================================================================

server {
    listen 80;
    server_name localhost;   # Ersetzen durch tatsächlichen Hostnamen, z.B. feuerwehr.local

    # Security-Header (siehe security-headers.conf; in jeder Location mit eigenem
    # add_header erneut eingebunden, weil nginx add_header sonst nicht vererbt)
    include /etc/nginx/snippets/feuerwehr-security-headers.conf;

    # Frontend (React SPA)
    root /var/www/feuerwehrmanagement/frontend;
    index index.html;

    # Gzip-Kompression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        text/xml
        application/xml
        image/svg+xml;
    gzip_min_length 1000;

    # Statische Assets (langes Caching für Vite-Hashed-Dateien)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/feuerwehr-security-headers.conf;
        try_files $uri =404;
    }

    # API-Proxy zum Node.js-Backend
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 90s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        client_max_body_size 10M;

        # Keine Security-Header für API-Antworten überschreiben
        proxy_hide_header X-Powered-By;
    }

    # Upload-Dateien werden bewusst NICHT direkt ausgeliefert: alle Downloads
    # laufen über authentifizierte API-Routen (/api/.../download).

    # SPA-Fallback für React Router
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        include /etc/nginx/snippets/feuerwehr-security-headers.conf;
    }

    # Versteckte Dateien und .env verweigern
    location ~ /\. { deny all; }
    location ~ \.env { deny all; }
    location ~ /backups/ { deny all; }
    location ~ /scripts/ { deny all; }
}

