# =============================================================================
# Security-Header für das Feuerwehr Management System
#
# nginx vererbt add_header NICHT in Locations, die selbst add_header setzen.
# Deshalb wird diese Datei auf Server-Ebene UND in jeder Location mit eigenem
# add_header eingebunden (include /etc/nginx/snippets/feuerwehr-security-headers.conf;).
#
# Betrieb nur im LAN über HTTP: kein HSTS (würde Browser auf HTTPS zwingen).
# =============================================================================

add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
# style-src 'unsafe-inline': React setzt style-Attribute; Skripte bleiben auf 'self' beschränkt.
# img-src data:/blob:: QR-Codes (data:-URL) und Vorschauen hochgeladener Bilder (blob:).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
